name: Release
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-24.04]

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libjavascriptcoregtk-4.1-dev libsoup-3.0-dev rpm libfuse2

      - name: Install frontend dependencies
        run: npm install

      - name: Download Piper Binary (Sidecar)
        run: |
          mkdir -p src-tauri/binaries
          if [ ! -d src-tauri/binaries/piper ]; then
            wget -O piper.tar.gz https://github.com/rhasspy/piper/releases/download/v1.2.0/piper_amd64.tar.gz
            tar -xzf piper.tar.gz
            cp -r piper src-tauri/binaries/
            chmod +x src-tauri/binaries/piper/piper
            rm -rf piper piper.tar.gz
          fi

      - uses: tauri-apps/tauri-action@v0.5.15
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPIMAGE_EXTRACT_AND_RUN: 1
        with:
          tagName: v__VERSION__
          releaseName: "Fina Ergen v__VERSION__"
          releaseBody: |
            Esta actualización optimiza la experiencia de usuario y la estabilidad del sistema de plugins, asegurando una integración perfecta con dispositivos IoT y multimedia.

            ### 🚀 Novedades y Mejoras Críticas:
            * **🔌 Plugin Manager Evolucionado**: Nuevo sistema de descubrimiento de monitores que soporta estructuras anidadas y garantiza la carga de scripts en cualquier categoría.
            * **🌡️ Panel de Clima en Tiempo Real**: Sincronización automática de datos de AC (consumo, temperatura, potencia) directamente en el panel principal desde el arranque.
            * **📺 Control de TV Universal**: Motor de sintonía de canales robustecido que localiza dinámicamente scripts de control en todo el repositorio del mercado.
            * **🔔 Optimización de Timbre Inteligente**: Corrección en el arranque del ecosistema Weston/Waydroid, asegurando que la cámara y el audio del timbre funcionen siempre desde la primera llamada.
            * **🛡️ Importación de Múltiples Rutas**: Mejora en la resolución de dependencias locales para plugins, eliminando errores de importación en entornos complejos.
            * **💎 Refinamiento Visual**: Actualización de marcas de tiempo y versiones en toda la interfaz para una trazabilidad total.

            ### 📦 Instalación:
            Descarga el archivo `.deb` o `.rpm` e instálalo normalmente. Al abrir Fina, ella te saludará en tu idioma y te guiará en los pasos iniciales si detecta que faltan componentes.
          releaseDraft: false
          prerelease: false
          args: --bundles deb,rpm

      - name: Build Patched AppImage (from Deb)
        run: |
          wget -q "https://github.com/AppImage/appimagekit/releases/download/continuous/appimagetool-x86_64.AppImage"
          chmod +x appimagetool-x86_64.AppImage

          APP_DIR=src-tauri/target/release/bundle/appimage/fina-ergen.AppDir
          VERSION=$(node -p "require('./package.json').version")

          echo "🔧 Extrayendo DEB para bypass de linuxdeploy..."
          mkdir -p "$APP_DIR"
          dpkg-deb -x src-tauri/target/release/bundle/deb/fina-ergen_${VERSION}_amd64.deb "$APP_DIR"

          echo "🔧 Construyendo estructura AppDir manual..."
          cd "$APP_DIR"
          ln -s usr/share/applications/fina-ergen.desktop fina-ergen.desktop
          ln -s usr/share/icons/hicolor/512x512/apps/fina-ergen.png fina-ergen.png
          ln -s fina-ergen.png .DirIcon

          # Crear AppRun symlink a usr/bin/fina-ergen
          ln -s usr/bin/fina-ergen AppRun
          chmod +x AppRun
          cd ../../../../../../

          echo "📦 Generando AppImage Patched (XZ)..."
          APPIMAGE_EXTRACT_AND_RUN=1 ARCH=x86_64 ./appimagetool-x86_64.AppImage --no-appstream --comp xz "$APP_DIR" fina-ergen-patched.AppImage

          echo "📤 Subiendo AppImage Patcheada..."
          GH_TOKEN=${{ secrets.GITHUB_TOKEN }} gh release upload "v${VERSION}" fina-ergen-patched.AppImage#"fina-ergen_${VERSION}_patched_amd64.AppImage" --clobber
